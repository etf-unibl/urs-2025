# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-de1soc"
BBFILE_PATTERN_meta-de1soc = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-de1soc = "7"

LAYERDEPENDS_meta-de1soc = "core"
LAYERSERIES_COMPAT_meta-de1soc = "kirkstone"
